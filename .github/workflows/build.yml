name: Build

on:
  push:
    branches: [ main ]
  create: 
    tags: releases/[1-9]+.[0-9]+.[0-9]+
  pull_request:
    branches: [ main ]

jobs:
  ubuntu-touch:
    strategy:
      matrix:
         arch: [amd64, arm64, armhf]
         framework: [ubuntu-touch-24.04-1.x, ubuntu-sdk-20.04]

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clickable
        run: python3 -m pip install clickable-ut --upgrade

      - name: Build
        run: |
          CLICKABLE_FRAMEWORK=${{ matrix.framework }} clickable build --arch ${{ matrix.arch }} --verbose

      - name: Upload .click to artifact
        uses: actions/upload-artifact@v4
        with:
          name: "youtube-web-${{ matrix.arch }}.click"
          path: "build/*/app/*.click"
          if-no-files-found: ignore

      - name: Publish to Open Store
        env:
          ARCH: ${{ matrix.arch }}
          OPENSTORE_KEY: ${{ secrets.OPENSTORE_KEY }}
        run: clickable publish "* $(git log -1 --pretty=%B | head -1)" --apikey ${OPENSTORE_KEY} --config clickable.json --arch ${ARCH}
        if: startsWith(github.ref, 'refs/tags/')


